name: flow-assistant
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assistant}
      POSTGRES_DB: assistant
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command:
      ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  agent:
    build:
      context: .
      dockerfile: ai-agent/Dockerfile
    environment:
      AGENT_BIND: 0.0.0.0:50051
      AGENT_TOKEN: ${AGENT_TOKEN:?Run make init first}
      AI_MODE: ${AI_MODE:-demo}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_RESPONSE_FORMAT: ${AI_RESPONSE_FORMAT:-json_schema}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import grpc; grpc.channel_ready_future(grpc.insecure_channel('localhost:50051')).result(timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    image: flow-assistant-go:local
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://assistant:${POSTGRES_PASSWORD:-assistant}@postgres:5432/assistant?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AGENT_ADDR: agent:50051
      HTTP_ADDR: 0.0.0.0:8080
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  worker:
    image: flow-assistant-go:local
    build: .
    command: ["/app/worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://assistant:${POSTGRES_PASSWORD:-assistant}@postgres:5432/assistant?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AGENT_ADDR: agent:50051
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      agent: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
